<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        ส่วนแบ่งเจ้าของสวน
    </title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    href="owner-share.css"
    rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2 class="page-title">
💰 ส่วนแบ่งเจ้าของสวน
</h2>

    <div class="search-card">

        <div class="mb-3">

            <label>เลือกสวน</label>

            <select id="farmId" class="form-control"></select>

        </div>

        <div class="mb-3">

            <label>งวดที่</label>

            <input
                type="number"
                id="round"
                class="form-control"
                value="1">

        </div>

        <button
            class="btn btn-primary"
            onclick="loadShare()">

            คำนวณ

        </button>

    </div>

    <div id="result" class="mt-4"></div>

</div>



<script>

async function loadFarmDropdown() {

    const response =
        await fetch(
            "https://palm-app-jt0i.onrender.com/farm"
        );

    const farms =
        await response.json();

    let html = "";

    farms.forEach(farm => {

        html += `
            <option value="${farm._id}">
                ${farm.name}
            </option>
        `;

    });

    document.getElementById("farmId").innerHTML =
        html;

}


async function loadShare() {

    const farmId =
        document.getElementById("farmId").value;

    const round =
        document.getElementById("round").value;

    const response =
        await fetch(
            `https://palm-app-jt0i.onrender.com/owner-share/${farmId}/${round}`
        );

    const data =
        await response.json();

    let html = `

    <div class="round-title">
        📊 งวดที่ ${data.round}
    </div>

    <div class="summary-grid">

        <div class="stat-card">

            <div class="stat-title">
                รายรับรวม
            </div>

            <div class="stat-value income">
                ฿${data.totalIncome.toLocaleString()}
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-title">
                รายจ่ายรวม
            </div>

            <div class="stat-value expense">
                ฿${data.totalExpense.toLocaleString()}
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-title">
                กำไรสุทธิ
            </div>

            <div class="stat-value profit">
                ฿${data.profit.toLocaleString()}
            </div>

        </div>

    </div>

    `;

    data.owners.forEach(owner => {

        html += `

        <div class="owner-card">

            <div class="owner-name">
                👤 ${owner.name}
            </div>

            <div class="owner-percent">
                ถือหุ้น ${owner.percent}%
            </div>

            <div class="share-value">
                ฿${owner.share.toLocaleString()}
            </div>

        </div>

        `;

    });

    document.getElementById("result").innerHTML =
        html;

}

loadFarmDropdown();

</script>
