<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่วนแบ่งเจ้าของสวน</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>💰 ส่วนแบ่งเจ้าของสวน</h2>

    <div class="card p-3 mt-3">

        <div class="mb-3">

            <label>เลือกสวน</label>

            <select id="farmId" class="form-control"></select>

        </div>

        <div class="mb-3">

            <label>งวดที่</label>

            <input
                type="number"
                id="round"
                class="form-control"
                value="1">

        </div>

        <button
            class="btn btn-primary"
            onclick="loadShare()">

            คำนวณ

        </button>

    </div>

    <div id="result" class="mt-4"></div>

</div>



<script>

async function loadFarmDropdown() {

    const response =
    await fetch(
        "https://palm-app-jt0i.onrender.com/farm"
    );

    const farms =
        await response.json();

    let html = "";

    farms.forEach(farm => {

        html += `
            <option value="${farm._id}">
                ${farm.name}
            </option>
        `;

    });

    document.getElementById(
        "farmId"
    ).innerHTML = html;

}

async function loadShare() {

    const farmId =
        document.getElementById(
            "farmId"
        ).value;

    const round =
        document.getElementById(
            "round"
        ).value;

    const response =
        await fetch(
            `https://palm-app-jt0i.onrender.com/owner-share/${farmId}/${round}`
        );

    const data =
        await response.json();

    let html = `

        <div class="card p-3">

            <h4>งวดที่ ${data.round}</h4>

            <p>
                รายรับรวม:
                ${data.totalIncome.toLocaleString()}
                บาท
            </p>

            <p>
                รายจ่ายรวม:
                ${data.totalExpense.toLocaleString()}
                บาท
            </p>

            <p>
                กำไรสุทธิ:
                ${data.profit.toLocaleString()}
                บาท
            </p>

        </div>

    `;

    data.owners.forEach(owner => {

        html += `

            <div class="card p-3 mt-3">

                <h5>
                    👤 ${owner.name}
                </h5>

                <p>
                    สัดส่วน:
                    ${owner.percent}%
                </p>

                <h4 class="text-success">

                    ${owner.share.toLocaleString()}
                    บาท

                </h4>

            </div>

        `;

    });

    document.getElementById(
        "result"
    ).innerHTML = html;

}

loadFarmDropdown();

</script>
