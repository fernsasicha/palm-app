<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palm App Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="mobile-header">

    <button
        class="hamburger"
        onclick="toggleMenu()">

        ☰

    </button>

    <h3>🌴 Palm App</h3>

</div>


<div class="layout">

    <div class="sidebar">

        <div class="logo">
            🌴 Palm App
        </div>

        <a href="dashboard.html" class="menu-item">
            📊 ภาพรวม
        </a>

        <a href="income.html" class="menu-item">
            💰 เพิ่มรายรับ
        </a>

        <a href="expense.html" class="menu-item">
            💸 เพิ่มรายจ่าย
        </a>

	<a href="owner-share.html" class="menu-item">
            💰 ส่วนแบ่งเจ้าของสวน
        </a>

        <a href="history.html" class="menu-item">
            📋 ประวัติ
        </a>

        <a href="farm-report.html" class="menu-item">
            📈 รายงานสวน
        </a>

        <a
            id="farmMenu"
            href="farm.html"
            class="menu-item">

            🌴 สวน

        </a>

        <a
            id="ownerMenu"
            href="owner.html"
            class="menu-item">

            👤 เจ้าของ

        </a>

        <a onclick="logout()" class="menu-item">

            🚪 Logout

        </a>

    </div>

    <div class="content">

        <div class="page-title">

            Overview

        </div>

        <div class="subtitle">

            <span id="welcome"></span>

        </div>

        <div class="card-grid">

            <div class="stat-card green">

                <div class="card-title">

                    รายรับรวม

                </div>

                <div
                    id="income"
                    class="card-value">

                    ...

                </div>

            </div>

            <div class="stat-card red">

                <div class="card-title">

                    รายจ่ายรวม

                </div>

                <div
                    id="expense"
                    class="card-value">

                    ...

                </div>

            </div>

            <div class="stat-card blue">

                <div class="card-title">

                    กำไรสุทธิ

                </div>

                <div
                    id="profit"
                    class="card-value">

                    ...

                </div>

            </div>

            <div class="stat-card orange">

                <div class="card-title">

                    Palm App

                </div>

                <div class="card-value">

                    🌴

                </div>

            </div>

        </div>

        <div class="welcome-box">

            <h4>ภาพรวมธุรกิจสวนปาล์ม</h4>

            <p>
                ดูรายรับ รายจ่าย กำไรสุทธิ
                และจัดการข้อมูลสวนปาล์มได้จากเมนูด้านซ้าย
            </p>

        </div>

    </div>

</div>

    <script>


if (!localStorage.getItem("userId")) {

    window.location.href =
        "login.html";

}


const role =
    localStorage.getItem("role");



document.getElementById(
    "welcome"
).innerText =
    "สวัสดี " +
    localStorage.getItem(
        "fullName"
    );



if (role === "owner") {

    document.getElementById(
        "farmMenu"
    ).style.display = "none";

    document.getElementById(
        "ownerMenu"
    ).style.display = "none";

}




        const dashboardUrl =

    role === "owner"

    ? `https://palm-app-jt0i.onrender.com/owner-dashboard/${
        localStorage.getItem("ownerId")
      }`

    : "https://palm-app-jt0i.onrender.com/dashboard";

fetch(dashboardUrl)
    .then(response => response.json())
    .then(data => {

        document.getElementById("income").innerText =
            data.totalIncome.toLocaleString();

        document.getElementById("expense").innerText =
            data.totalExpense.toLocaleString();

        document.getElementById("profit").innerText =
            data.profit.toLocaleString();

    })
    .catch(error => {

    console.log(error);

    document.getElementById(
        "income"
    ).innerText = "ผิดพลาด";

    document.getElementById(
        "expense"
    ).innerText = "ผิดพลาด";

    document.getElementById(
        "profit"
    ).innerText = "ผิดพลาด";

});


function logout() {

    localStorage.clear();

    window.location.href =
        "login.html";

}

function toggleMenu() {

    document
        .querySelector(".sidebar")
        .classList
        .toggle("active");

}

    </script>

</body>

</html>
