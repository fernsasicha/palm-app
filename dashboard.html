<head>

<body>

   <div class="container mt-4">

    <div class="top-card">

        <h2>🌴 Palm App</h2>

    </div>

    <div class="summary-card">

        <div class="summary-title">

        <div

            class="summary-value income">

            กำลังโหลด...

        </div>

    </div>

    <div class="summary-card">

        <div class="summary-title">
            รายจ่ายรวม
        </div>

        <div
            id="expense"
            class="summary-value expense">

            กำลังโหลด...

        </div>

    </div>

    <div class="summary-card">

        <div class="summary-title">
            กำไรสุทธิ
        </div>

        <div
            id="profit"
            class="summary-value profit">

            กำลังโหลด...

        </div>

    </div>

    expense.html

    <a

สวน

    <a

    <button
        class="btn menu-btn logout-btn"
        onclick="logout()">

        Logout

    </button>

</div>

    <script>


if (!localStorage.getItem("userId")) {

    window.location.href =
        "login.html";

}


const role =
    localStorage.getItem("role");



document.getElementById(
    "welcome"
).innerText =
    "สวัสดี " +
    localStorage.getItem(
        "fullName"
    );



if (role === "owner") {

    document.getElementById(
        "farmMenu"
    ).style.display = "none";

    document.getElementById(
        "ownerMenu"
    ).style.display = "none";

}




        const dashboardUrl =

    role === "owner"

    ? `https://palm-app-jt0i.onrender.com/owner-dashboard/${
        localStorage.getItem("ownerId")
      }`

    : "https://palm-app-jt0i.onrender.com/dashboard";

fetch(dashboardUrl)
    .then(response => response.json())
    .then(data => {

        document.getElementById("income").innerText =
            data.totalIncome.toLocaleString();

        document.getElementById("expense").innerText =
            data.totalExpense.toLocaleString();

        document.getElementById("profit").innerText =
            data.profit.toLocaleString();

    })
    .catch(error => {

    console.log(error);

    document.getElementById(
        "income"
    ).innerText = "ผิดพลาด";

    document.getElementById(
        "expense"
    ).innerText = "ผิดพลาด";

    document.getElementById(
        "profit"
    ).innerText = "ผิดพลาด";

});


function logout() {

    localStorage.clear();

    window.location.href =
        "login.html";

}



    </script>

</body>

</html>
