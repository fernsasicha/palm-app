<h2>
🔒 ขอปิดงวด
</h2>

<select id="farmId"></select>

<input
    type="number"
    id="round"
    value="1">

<button
    onclick="closeRound()">

    ส่งคำขอปิดงวด

</button>

<script>

async function loadFarmDropdown() {

    const response =
        await fetch(
            "https://palm-app-jt0i.onrender.com/farm"
        );

    const farms =
        await response.json();

    let html = "";

    farms.forEach(farm => {

        html += `
            <option value="${farm._id}">
                ${farm.name}
            </option>
        `;

    });

    document.getElementById(
        "farmId"
    ).innerHTML = html;

}

async function closeRound() {

    const farmId =
        document.getElementById(
            "farmId"
        ).value;

    const round =
        document.getElementById(
            "round"
        ).value;

    const ownerId =
        localStorage.getItem(
            "ownerId"
        );

    const response =
        await fetch(
            "https://palm-app-jt0i.onrender.com/close-round-request",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                    farmId,
                    round,
                    ownerId

                })
            }
        );

    const data =
        await response.json();

    alert(
        data.message ||
        "ส่งคำขอปิดงวดสำเร็จ ✅"
    );

}


loadFarmDropdown();

</script>
