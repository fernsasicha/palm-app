<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
ประวัติส่วนแบ่ง
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container mt-4">

<h2>
📜 ประวัติส่วนแบ่งของฉัน
</h2>

<div id="history"></div>

</div>

<script>

async function loadHistory() {

    const ownerId =
        localStorage.getItem(
            "ownerId"
        );

    const response =
        await fetch(
            `https://palm-app-jt0i.onrender.com/owner-share-history/${ownerId}`
        );

    const data =
        await response.json();

    let html = "";

    data.forEach(item => {

        html += `

        <div class="card p-3 mt-3">

            <h4>

                งวดที่ ${item.round}

            </h4>

            <p>

                กำไรสุทธิ

                ฿${item.profit.toLocaleString()}

            </p>

            <h3
                style="
                color:#10b981;
                ">

                ฿${item.share.toLocaleString()}

            </h3>

        </div>

        `;

    });

    document
        .getElementById(
            "history"
        ).innerHTML =
            html;

}

loadHistory();

</script>

</body>

</html>
