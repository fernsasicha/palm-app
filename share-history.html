<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
ประวัติส่วนแบ่ง
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container mt-4">

<h2>
📜 ประวัติส่วนแบ่งของฉัน
</h2>

<div id="history"></div>

</div>

<script>

async function loadHistory() {

    const ownerId =
        localStorage.getItem(
            "ownerId"
        );

    const response =
        await fetch(
            `https://palm-app-jt0i.onrender.com/owner-share-history/${ownerId}`
        );

    const data =
        await response.json();

    const totalShare =
        data.reduce(
            (sum, item) =>
                sum + item.share,
            0
        );

    let html = `

    <div class="card p-4 mt-3 mb-4">

        <h4>
            💰 ส่วนแบ่งสะสม
        </h4>

        <h1
            style="
            color:#10b981;
            font-weight:700;
            ">

            ฿${totalShare.toLocaleString()}

        </h1>

    </div>

    `;

    data.forEach(item => {

        html += `

        <div class="card p-3 mt-3">

            <h4>
                งวดที่ ${item.round}
            </h4>

            <p>
                กำไรสุทธิ
                ฿${item.profit.toLocaleString()}
            </p>

            <h3 style="
                color:${item.share >= 0
                    ? '#10b981'
                    : '#ef4444'
                };
            ">

                ${
                    item.share >= 0
                    ? '฿' + item.share.toLocaleString()
                    : 'ขาดทุน ฿' +
                      Math.abs(item.share).toLocaleString()
                }

            </h3>

        </div>

        `;

    });

    document.getElementById(
        "history"
    ).innerHTML = html;

}

loadHistory();

</script>

</body>

</html>
